services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/arcanaforge
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config-docker.yml run
    volumes:
      - C:/Users/Danillo/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  mongo-data:
